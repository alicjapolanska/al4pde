defaults:
  - base
  - scheduler: cosine

_target_: al4pde.models.fno_wrapper.FNOWrapper
training_type: 'teacher_forcing_schedule'
encode_pde_param_log: false
block_grad: false
add_one_step: false

optimizer:
  _target_: torch.optim.Adam
  lr: 5.e-4
  weight_decay: 1e-5


model:
  if_conditional: true
  num_channels: 1
  modes: 32
  width: 64
  predict_delta: true